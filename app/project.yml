# Source of truth for Nordyg.xcodeproj. Regenerate with `make xcodeproj`
# (needs xcodegen); the generated project is committed so building from
# source only needs Xcode.
name: Nordyg
options:
  bundleIdPrefix: foo.n0rdy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # In-app updates for the signed releases. Pinned exactly; bump deliberately.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Nordyg:
    type: application
    platform: macOS
    sources:
      - path: Nordyg
        excludes:
          - "AppIcon.icon/**"
      - path: Nordyg/AppIcon.icon
        type: file
        buildPhase: resources
      - path: NordygCore
        buildPhase: none
    info:
      path: Nordyg/Info.plist
      properties:
        CFBundleName: Nordyg
        CFBundleDisplayName: Nordyg
        # Set from the release tag and the CI run number (see release.yml).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the feed is the newest release's appcast asset; updates are
        # verified with the EdDSA key, and installed through Sparkle's
        # installer service, which a sandboxed app needs.
        SUFeedURL: https://github.com/n0rdy/nordyg/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: true
        SUVerifyUpdateBeforeExtraction: true
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
    entitlements:
      path: Nordyg/Nordyg.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sparkle's installer service, reached from inside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: foo.n0rdy.nordyg
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Sparkle's public EdDSA key (generate_keys --account nordyg prints it).
        # Not a secret: it lets the app accept only updates signed with the
        # matching private key. Empty means the updater does not start.
        SPARKLE_PUBLIC_ED_KEY: "B8wxeWuiyPknwlj4vBAy0Hq0mT19Ry8tTEJVpaQqZwI="
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: Nordyg
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/NordygCore
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/build
        OTHER_LDFLAGS: ["-lnordyg", "-lresolv"]
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: Sparkle
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
schemes:
  Nordyg:
    build:
      targets:
        Nordyg: all
    run:
      config: Debug
    archive:
      config: Release
