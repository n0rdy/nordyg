name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: core/go.sum
      - name: Go tests
        run: make test
      - name: Universal archive
        run: make archive
      - name: Swift bridge smoke test
        run: make smoke
      - name: Build app
        run: make app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libnordyg
          path: |
            core/build/libnordyg.a
            core/build/libnordyg.h
