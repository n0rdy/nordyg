name: Deploy site (nordyg.com)

# Builds the Astro site in landing/ and deploys it to Cloudflare Pages.
# Pushes to main deploy production; pull requests from branches in this repo
# get a preview URL (fork PRs have no access to the secrets, so they only build).
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit), CLOUDFLARE_ACCOUNT_ID.
# Actions are pinned to commit SHAs; the comment carries the version.

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build site
        working-directory: landing
        run: |
          npm ci
          npm run build

      # The branch name is untrusted input on pull requests. Validate it and
      # hand it over through an environment variable, never interpolated into
      # the command line, so it cannot smuggle extra flags to wrangler.
      - name: Validate branch name
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$RAW_BRANCH" in
            ""|-*) echo "refusing branch name '$RAW_BRANCH'"; exit 1 ;;
            *[!A-Za-z0-9._/-]*) echo "refusing branch name '$RAW_BRANCH'"; exit 1 ;;
          esac
          echo "DEPLOY_BRANCH=$RAW_BRANCH" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing/dist --project-name=nordyg --branch="$DEPLOY_BRANCH"
